[package]
name = "glab-feed"
version = "0.1.0"
edition = "2021"
description = "Live-updating TUI for GitLab merge requests via the glab CLI"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-humanize = "0.2"
open = "5"
toml = "0.8"
dirs = "5"
anyhow = "1"
futures = "0.3"
arboard = "3"
